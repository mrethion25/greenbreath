<svg width="300" height="200" viewBox="0 0 300 200" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#E8F5E9" />
            <stop offset="100%" stop-color="#C8E6C9" />
        </linearGradient>
        <linearGradient id="leafGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#4CAF50" />
            <stop offset="100%" stop-color="#2E7D32" />
        </linearGradient>
        <linearGradient id="stemGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#388E3C" />
            <stop offset="100%" stop-color="#1B5E20" />
        </linearGradient>
        <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#2E8B57" />
            <stop offset="100%" stop-color="#1B5E20" />
        </linearGradient>
        <filter id="textShadow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur in="SourceAlpha" stdDeviation="2" />
            <feOffset dx="2" dy="2" result="offsetblur" />
            <feFlood flood-color="#1B5E20" flood-opacity="0.3" />
            <feComposite in2="offsetblur" operator="in" />
            <feMerge>
                <feMergeNode />
                <feMergeNode in="SourceGraphic" />
            </feMerge>
        </filter>
    </defs>
    
    <!-- Logo Container -->
    <g transform="translate(20, 20) scale(0.8)">
        <!-- Background circle -->
        <circle cx="100" cy="100" r="90" fill="url(#bgGradient)" stroke="#2E8B57" stroke-width="2"/>
        
        <!-- Leaf stem -->
        <path d="M100 60 L100 140" stroke="url(#stemGradient)" stroke-width="8" stroke-linecap="round"/>
        
        <!-- Leaf left side -->
        <path d="M100 80 Q70 70 80 50 Q90 30 100 40" fill="url(#leafGradient)"/>
        <path d="M100 100 Q75 90 85 70 Q95 50 100 60" fill="#66BB6A"/>
        <path d="M100 120 Q80 110 90 90 Q100 70 100 80" fill="#81C784"/>
        
        <!-- Leaf right side -->
        <path d="M100 80 Q130 70 120 50 Q110 30 100 40" fill="url(#leafGradient)"/>
        <path d="M100 100 Q125 90 115 70 Q105 50 100 60" fill="#66BB6A"/>
        <path d="M100 120 Q120 110 110 90 Q100 70 100 80" fill="#81C784"/>
        
        <!-- Air flow circles -->
        <circle cx="100" cy="50" r="8" fill="#B2EBF2" opacity="0.8"/>
        <circle cx="85" cy="45" r="6" fill="#B2EBF2" opacity="0.6"/>
        <circle cx="115" cy="45" r="6" fill="#B2EBF2" opacity="0.6"/>
        <circle cx="75" cy="55" r="5" fill="#B2EBF2" opacity="0.5"/>
        <circle cx="125" cy="55" r="5" fill="#B2EBF2" opacity="0.5"/>
        
        <!-- Highlight effect -->
        <ellipse cx="105" cy="75" rx="15" ry="8" fill="white" opacity="0.3"/>
    </g>
    
    <!-- GB Text -->
    <g transform="translate(160, 60)">
        <!-- G Letter -->
        <path d="M20,80 Q20,40 50,20 Q80,10 100,20 Q120,30 120,60 Q120,90 100,110 Q80,130 50,120 Q30,110 30,90 L60,90 Q60,100 70,105 Q80,110 90,105 Q100,100 100,90 Q100,80 90,75 Q80,70 70,75 L70,50 L100,50 L100,20 Q70,5 40,20 Q15,40 15,70 Q15,100 40,120 Q70,140 105,120 Q130,100 130,70 Q130,40 110,20 Q90,5 65,5 L65,35 Q85,35 95,45 Q105,55 105,70 Q105,85 95,95 Q85,105 70,105 Q55,105 45,95 Q35,85 35,70 Q35,55 45,45 Q55,35 70,35 L70,5 Q45,10 25,30 Q5,55 5,85 Q5,115 25,135 Q45,155 75,155 Q105,155 125,135 Q145,115 145,85 Q145,55 125,35 Q105,15 75,15 Z" 
              fill="url(#textGradient)" filter="url(#textShadow)"/>
        
        <!-- B Letter -->
        <path d="M150,20 L150,140 L190,140 Q220,140 230,120 Q240,100 230,80 Q240,60 230,40 Q220,20 190,20 L150,20 Z M180,50 Q195,50 200,60 Q205,70 200,80 Q205,90 200,100 Q195,110 180,110 L180,50 Z M180,110 Q195,110 200,120 Q205,130 200,140 L180,140 L180,110 Z M180,20 L180,50 Q195,50 200,40 Q205,30 200,20 L180,20 Z" 
              fill="url(#textGradient)" filter="url(#textShadow)"/>
    </g>
</svg>
