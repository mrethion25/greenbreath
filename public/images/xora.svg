<svg width="320" height="160" viewBox="0 0 320 160" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#E8F5E9" />
            <stop offset="100%" stop-color="#C8E6C9" />
        </linearGradient>
        <linearGradient id="leafGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#4CAF50" />
            <stop offset="100%" stop-color="#2E7D32" />
        </linearGradient>
        <linearGradient id="stemGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#388E3C" />
            <stop offset="100%" stop-color="#1B5E20" />
        </linearGradient>
        <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#2E8B57" />
            <stop offset="50%" stop-color="#1B5E20" />
            <stop offset="100%" stop-color="#2E8B57" />
        </linearGradient>
        <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur in="SourceAlpha" stdDeviation="3" />
            <feOffset dx="2" dy="2" result="offsetblur" />
            <feFlood flood-color="#1B5E20" flood-opacity="0.2" />
            <feComposite in2="offsetblur" operator="in" />
            <feMerge>
                <feMergeNode />
                <feMergeNode in="SourceGraphic" />
            </feMerge>
        </filter>
    </defs>

    <!-- Circle + Leaf Icon -->
    <g transform="translate(10, 10)">
        <circle cx="60" cy="60" r="55" fill="url(#bgGradient)" stroke="#2E8B57" stroke-width="1.5"/>
        <path d="M60 40 L60 95" stroke="url(#stemGradient)" stroke-width="5" stroke-linecap="round"/>
        <path d="M60 55 Q40 50 45 35 Q50 20 60 25" fill="url(#leafGradient)"/>
        <path d="M60 70 Q45 65 50 50 Q55 35 60 40" fill="#66BB6A"/>
        <path d="M60 85 Q50 80 55 65 Q60 50 60 55" fill="#81C784"/>
        <path d="M60 55 Q80 50 75 35 Q70 20 60 25" fill="url(#leafGradient)"/>
        <path d="M60 70 Q75 65 70 50 Q65 35 60 40" fill="#66BB6A"/>
        <path d="M60 85 Q70 80 65 65 Q60 50 60 55" fill="#81C784"/>
        <circle cx="60" cy="35" r="5" fill="#B2EBF2" opacity="0.8"/>
        <circle cx="50" cy="32" r="4" fill="#B2EBF2" opacity="0.6"/>
        <circle cx="70" cy="32" r="4" fill="#B2EBF2" opacity="0.6"/>
        <ellipse cx="63" cy="50" rx="9" ry="4" fill="white" opacity="0.3"/>
    </g>

    <!-- TEXT: Position corrected -->
    <text x="200" y="70" font-family="Arial, sans-serif" font-size="50" font-weight="bold"
          fill="url(#textGradient)" filter="url(#shadow)" text-anchor="middle" letter-spacing="2">
        GB
    </text>

    <text x="200" y="105" font-family="Arial, sans-serif" font-size="18" fill="#2E8B57"
          text-anchor="middle" font-weight="600" letter-spacing="1">
        GreenBreath
    </text>

    <text x="200" y="125" font-family="Arial, sans-serif" font-size="11" fill="#5a7d5a"
          text-anchor="middle" font-weight="400" letter-spacing="0.5">
        serving clean air!!
    </text>
</svg>
