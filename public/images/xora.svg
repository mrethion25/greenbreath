<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GreenBreath Logo</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: linear-gradient(135deg, #f8fdf8 0%, #e8f5e9 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            color: #2d5a3d;
        }
        
        .container {
            max-width: 900px;
            width: 100%;
            text-align: center;
        }
        
        .logo-card {
            background: white;
            border-radius: 24px;
            padding: 40px;
            box-shadow: 0 15px 35px rgba(46, 139, 87, 0.1);
            margin-bottom: 30px;
            border: 1px solid #e0f2e1;
        }
        
        .logo-container {
            display: flex;
            justify-content: center;
            margin-bottom: 30px;
        }
        
        .logo {
            width: 200px;
            height: 200px;
            filter: drop-shadow(0 10px 20px rgba(76, 175, 80, 0.2));
        }
        
        .brand-name {
            font-size: 3.5rem;
            font-weight: 700;
            color: #2E8B57;
            margin-bottom: 10px;
            letter-spacing: -0.5px;
        }
        
        .tagline {
            font-size: 1.3rem;
            color: #5a7d5a;
            margin-bottom: 30px;
            font-weight: 400;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
        }
        
        .features {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 20px;
            margin-top: 30px;
        }
        
        .feature {
            background: #f1f8e9;
            padding: 15px 25px;
            border-radius: 50px;
            font-weight: 500;
            color: #2E8B57;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 10px rgba(76, 175, 80, 0.1);
        }
        
        .download-section {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 30px;
        }
        
        .download-btn {
            padding: 14px 32px;
            background: #2E8B57;
            color: white;
            border: none;
            border-radius: 50px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 6px 20px rgba(46, 139, 87, 0.3);
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .download-btn:hover {
            background: #267349;
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(46, 139, 87, 0.4);
        }
        
        .preview-text {
            margin-top: 20px;
            color: #7a9c7a;
            font-size: 0.95rem;
        }
        
        @media (max-width: 600px) {
            .logo-card {
                padding: 30px 20px;
            }
            
            .brand-name {
                font-size: 2.8rem;
            }
            
            .tagline {
                font-size: 1.1rem;
            }
            
            .download-section {
                flex-direction: column;
                align-items: center;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo-card">
            <div class="logo-container">
                <svg class="logo" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
                    <!-- Background circle with gradient -->
                    <defs>
                        <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#E8F5E9" />
                            <stop offset="100%" stop-color="#C8E6C9" />
                        </linearGradient>
                        <linearGradient id="leafGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#4CAF50" />
                            <stop offset="100%" stop-color="#2E7D32" />
                        </linearGradient>
                        <linearGradient id="stemGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#388E3C" />
                            <stop offset="100%" stop-color="#1B5E20" />
                        </linearGradient>
                        <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
                            <feGaussianBlur in="SourceAlpha" stdDeviation="4" />
                            <feOffset dx="0" dy="4" result="offsetblur" />
                            <feFlood flood-color="#2E8B57" flood-opacity="0.2" />
                            <feComposite in2="offsetblur" operator="in" />
                            <feMerge>
                                <feMergeNode />
                                <feMergeNode in="SourceGraphic" />
                            </feMerge>
                        </filter>
                    </defs>
                    
                    <!-- Background circle -->
                    <circle cx="100" cy="100" r="90" fill="url(#bgGradient)" stroke="#2E8B57" stroke-width="2" />
                    
                    <!-- Leaf stem -->
                    <path d="M100 60 L100 140" stroke="url(#stemGradient)" stroke-width="8" stroke-linecap="round" />
                    
                    <!-- Leaf left side -->
                    <path d="M100 80 Q70 70 80 50 Q90 30 100 40" fill="url(#leafGradient)" />
                    <path d="M100 100 Q75 90 85 70 Q95 50 100 60" fill="#66BB6A" />
                    <path d="M100 120 Q80 110 90 90 Q100 70 100 80" fill="#81C784" />
                    
                    <!-- Leaf right side -->
                    <path d="M100 80 Q130 70 120 50 Q110 30 100 40" fill="url(#leafGradient)" />
                    <path d="M100 100 Q125 90 115 70 Q105 50 100 60" fill="#66BB6A" />
                    <path d="M100 120 Q120 110 110 90 Q100 70 100 80" fill="#81C784" />
                    
                    <!-- Air flow circles -->
                    <circle cx="100" cy="50" r="8" fill="#B2EBF2" opacity="0.8" />
                    <circle cx="85" cy="45" r="6" fill="#B2EBF2" opacity="0.6" />
                    <circle cx="115" cy="45" r="6" fill="#B2EBF2" opacity="0.6" />
                    <circle cx="75" cy="55" r="5" fill="#B2EBF2" opacity="0.5" />
                    <circle cx="125" cy="55" r="5" fill="#B2EBF2" opacity="0.5" />
                    
                    <!-- Highlight effect -->
                    <ellipse cx="105" cy="75" rx="15" ry="8" fill="white" opacity="0.3" />
                </svg>
            </div>
            
            <h1 class="brand-name">greenbreath</h1>
            <p class="tagline">Clean air for every living organism</p>
            
            <div class="features">
                <div class="feature">
                    <span>🌱</span> Natural
                </div>
                <div class="feature">
                    <span>💨</span> Clean Air
                </div>
                <div class="feature">
                    <span>🌍</span> Eco-Friendly
                </div>
            </div>
            
            <div class="download-section">
                <button class="download-btn" onclick="downloadSVG()">
                    <span>⬇️</span> Download SVG Logo
                </button>
            </div>
            
            <p class="preview-text">Premium logo for GreenBreath - Clean air solutions</p>
        </div>
    </div>

    <script>
        function downloadSVG() {
            // Create the SVG content
            const svgContent = `<?xml version="1.0" encoding="UTF-8"?>
<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#E8F5E9" />
            <stop offset="100%" stop-color="#C8E6C9" />
        </linearGradient>
        <linearGradient id="leafGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#4CAF50" />
            <stop offset="100%" stop-color="#2E7D32" />
        </linearGradient>
        <linearGradient id="stemGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#388E3C" />
            <stop offset="100%" stop-color="#1B5E20" />
        </linearGradient>
    </defs>
    
    <!-- Background circle -->
    <circle cx="100" cy="100" r="90" fill="url(#bgGradient)" stroke="#2E8B57" stroke-width="2"/>
    
    <!-- Leaf stem -->
    <path d="M100 60 L100 140" stroke="url(#stemGradient)" stroke-width="8" stroke-linecap="round"/>
    
    <!-- Leaf left side -->
    <path d="M100 80 Q70 70 80 50 Q90 30 100 40" fill="url(#leafGradient)"/>
    <path d="M100 100 Q75 90 85 70 Q95 50 100 60" fill="#66BB6A"/>
    <path d="M100 120 Q80 110 90 90 Q100 70 100 80" fill="#81C784"/>
    
    <!-- Leaf right side -->
    <path d="M100 80 Q130 70 120 50 Q110 30 100 40" fill="url(#leafGradient)"/>
    <path d="M100 100 Q125 90 115 70 Q105 50 100 60" fill="#66BB6A"/>
    <path d="M100 120 Q120 110 110 90 Q100 70 100 80" fill="#81C784"/>
    
    <!-- Air flow circles -->
    <circle cx="100" cy="50" r="8" fill="#B2EBF2" opacity="0.8"/>
    <circle cx="85" cy="45" r="6" fill="#B2EBF2" opacity="0.6"/>
    <circle cx="115" cy="45" r="6" fill="#B2EBF2" opacity="0.6"/>
    <circle cx="75" cy="55" r="5" fill="#B2EBF2" opacity="0.5"/>
    <circle cx="125" cy="55" r="5" fill="#B2EBF2" opacity="0.5"/>
    
    <!-- Highlight effect -->
    <ellipse cx="105" cy="75" rx="15" ry="8" fill="white" opacity="0.3"/>
</svg>`;

            // Create a Blob and download link
            const blob = new Blob([svgContent], { type: 'image/svg+xml' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'greenbreath-logo.svg';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }
    </script>
</body>
</html>
