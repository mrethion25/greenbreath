<svg xmlns="http://www.w3.org/2000/svg" width="360" height="120" viewBox="0 0 360 120">
  <defs>
    <!-- Premium gradient -->
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#9CFFB0"/>
      <stop offset="50%" stop-color="#2DBA55"/>
      <stop offset="100%" stop-color="#0A5A2C"/>
    </linearGradient>

    <!-- Soft Glow -->
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Realistic Leaf Icon -->
  <g transform="translate(18, 5)" filter="url(#softGlow)">
    <path d="M60 0
             C25 10 0 45 10 75
             C20 105 50 115 75 110
             C105 100 120 65 110 40
             C100 10 80 -2 60 0Z"
          fill="url(#leafGrad)"/>
    <path d="M60 5
             C50 45 55 75 70 105"
          stroke="#E9FFE9" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M60 45
             C45 60 40 70 35 90"
          stroke="#E9FFE9" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M60 45
             C75 60 85 70 95 90"
          stroke="#E9FFE9" stroke-width="3" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Premium Text -->
  <text x="140" y="75"
        font-family="Cinzel, Times New Roman, serif"
        font-size="52"
        font-weight="700"
        letter-spacing="4"
        fill="url(#leafGrad)"
        filter="url(#softGlow)">
    GREENBREATH
  </text>
</svg>
